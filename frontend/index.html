<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <title>File Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1 class="mb-3">ファイル一覧</h1>

  <table id="fileTable" class="table table-striped table-hover align-middle">
    <thead class="table-light">
      <tr><th>ID</th><th>名前</th><th>更新日時 (UTC)</th><th>ディレクトリ</th><th></th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const API = "http://127.0.0.1:8000/api";

    async function fetchFiles() {
      const res = await fetch(`${API}/files`);
      const files = await res.json();
      const tbody = document.querySelector("#fileTable tbody");
      tbody.innerHTML = "";                           // reset
      files.forEach(f => {
        const tr = tbody.insertRow();
        tr.insertCell().textContent = f.id;
        const nameCell = tr.insertCell();
        nameCell.innerHTML = `<span class="filename">${f.filename}</span>`;
        tr.insertCell().textContent = new Date(f.timestamp).toLocaleString();
        tr.insertCell().textContent = f.dir.replace(/^.*\//, "…/");
        const editBtn = tr.insertCell();
        editBtn.innerHTML = `<button class="btn btn-sm btn-outline-primary">Rename</button>`;
        editBtn.onclick = () => renamePrompt(f.id, f.filename);
      });
    }

    async function renamePrompt(id, oldName) {
      const newName = prompt("新しいファイル名を入力:", oldName);
      if (!newName || newName === oldName) return;
      const res = await fetch(`${API}/file/${id}?new_name=${encodeURIComponent(newName)}`, {method:"PUT"})
      if (res.ok) {
        await fetchFiles();
      } else {
        alert("リネーム失敗: " + (await res.json()).detail);
      }
    }

    fetchFiles();
  </script>
</body>
</html>
